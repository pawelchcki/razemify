actions:
  - name: "Build and Test"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    container_image: "ubuntu-24.04"
    timeout: "30m"
    steps:
      - run: bazel test --config=ci //...

      - run: |
          mode=dbg
          if [[ "$(git branch --show-current)" == "main" ]]; then
            mode=opt
          fi

          bazel build \
            --config=ci \
            --remote_download_toplevel \
            -c "$mode" \
            //flutter_razemify/example:example_arm64 \
            //flutter_razemify/example:example_x64 \
            //razemify-wasm:razemify_wasm

          verify_apk() {
            local apk="$1"
            local abi="$2"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libflutter_razemify.so"
            unzip -Z1 "$apk" | grep -Fx "assets/flutter_assets/AssetManifest.bin"
          }

          verify_apk bazel-bin/flutter_razemify/example/example_arm64.apk arm64-v8a
          verify_apk bazel-bin/flutter_razemify/example/example_x64.apk x86_64
