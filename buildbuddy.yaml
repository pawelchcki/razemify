actions:
  - name: "Build and Test"
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    container_image: "ubuntu-24.04"
    timeout: "30m"
    # The default Linux workflow VM (3 CPU, 8GB RAM, 20GB disk) runs out of
    # disk once the Android SDK/NDK, LLVM, Flutter and JDK repositories, the
    # fastbuild and opt output trees, and the recycled runner's state add up,
    # and 3 CPUs make every remote-cache miss slow.
    resource_requests:
      cpu: 16
      memory: 32GB
      disk: 60GB
    steps:
      - run: bazel test --config=ci //...

      - run: |
          bazel build \
            --config=ci \
            --remote_download_toplevel \
            -c opt \
            //flutter_razemify/example:example_arm64 \
            //flutter_razemify/example:example_x64 \
            //razemify-wasm:razemify_wasm

          verify_apk() {
            local apk="$1"
            local abi="$2"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libflutter_razemify.so"
            unzip -Z1 "$apk" | grep -Fx "assets/flutter_assets/AssetManifest.bin"
          }

          verify_apk bazel-bin/flutter_razemify/example/example_arm64.apk arm64-v8a
          verify_apk bazel-bin/flutter_razemify/example/example_x64.apk x86_64
