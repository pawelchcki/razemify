name: Bazel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bazel:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          curl -fsSLo "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x "$RUNNER_TEMP/bazel"
          sudo mv "$RUNNER_TEMP/bazel" /usr/local/bin/bazel
          bazel version

      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            printf "%s\n" \
              "build --config=ci" \
              "build --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
              "build --build_metadata=COMMIT_SHA=${COMMIT_SHA}" \
              >> "$GITHUB_WORKSPACE/user.bazelrc"
          fi

      # `bazel test //...` covers all non-manual targets and quality gates. The
      # Android application macros are tagged manual and built explicitly below.
      - name: Build and test everything
        run: |
          bazel test //...

      - name: Build and inspect Android APKs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=opt
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mode=dbg
          fi

          bazel build \
            -c "$mode" \
            //flutter_razemify/example:example_arm64 \
            //flutter_razemify/example:example_x64

          verify_apk() {
            local apk="$1"
            local abi="$2"
            unzip -Z1 "$apk" | grep -Fx "lib/$abi/libflutter_razemify.so"
            unzip -Z1 "$apk" | grep -Fx "assets/flutter_assets/AssetManifest.bin"
          }

          verify_apk bazel-bin/flutter_razemify/example/example_arm64.apk arm64-v8a
          verify_apk bazel-bin/flutter_razemify/example/example_x64.apk x86_64

      # xtask's deployment path invokes wasm-pack directly; keep that release
      # packaging and wasm-opt configuration covered in addition to Bazel's
      # wasm-bindgen target.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: 0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          archive="$RUNNER_TEMP/wasm-pack.tar.gz"
          unpacked="$RUNNER_TEMP/wasm-pack"
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$WASM_PACK_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$unpacked"
          tar -xzf "$archive" --strip-components=1 -C "$unpacked"
          sudo install -m 0755 "$unpacked/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Build WASM release package
        run: wasm-pack build --target web --release
        working-directory: razemify-wasm

      # The Flutter analyze/format gates and the example widget test are the
      # part Cargo cannot cover, so surface their logs when they fail.
      - name: Show test logs on failure
        if: failure()
        run: |
          find bazel-testlogs -name test.log -print -exec cat {} + || true
