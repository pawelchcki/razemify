name: Bazel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  bazel:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          curl -fsSLo "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x "$RUNNER_TEMP/bazel"
          sudo mv "$RUNNER_TEMP/bazel" /usr/local/bin/bazel
          bazel version

      # The adapter is read-only on pull requests and read-write only on
      # protected default-branch pushes. Cache failures remain non-fatal.
      - name: Start Bazel cache adapter
        id: bazel-cache
        uses: thii/bazel-gha-remote-cache@6794727832d09a0a98c6edbbd013a10ddac2925a
        with:
          storage-mode: pack
          namespace: razemify-bazel-v1
          mode: auto
          flush-timeout-seconds: '300'
          fail-job-on-cache-error: 'false'

      # `bazel test //...` builds every matched non-test target (including
      # //:clippy) and runs all test targets in one analysis pass. Pull requests
      # still build the debug APK but reserve the release app bundle for main.
      - name: Build and test everything
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          targets=(//...)
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            targets+=(-//flutter_razemify/example:example_bundle)
          fi
          bazel \
            --bazelrc="${{ steps.bazel-cache.outputs.bazelrc }}" \
            test \
            --remote_download_toplevel \
            -- "${targets[@]}"

      # xtask's deployment path invokes wasm-pack directly; keep that release
      # packaging and wasm-opt configuration covered in addition to Bazel's
      # wasm-bindgen target.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: 0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          archive="$RUNNER_TEMP/wasm-pack.tar.gz"
          unpacked="$RUNNER_TEMP/wasm-pack"
          curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$WASM_PACK_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$unpacked"
          tar -xzf "$archive" --strip-components=1 -C "$unpacked"
          sudo install -m 0755 "$unpacked/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Build WASM release package
        run: wasm-pack build --target web --release
        working-directory: razemify-wasm

      # The Flutter analyze/format gates and the example widget test are the
      # part Cargo cannot cover, so surface their logs when they fail.
      - name: Show test logs on failure
        if: failure()
        run: |
          find bazel-testlogs -name test.log -print -exec cat {} + || true
