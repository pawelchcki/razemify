name: Bazel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bazel:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          curl -fsSLo "$RUNNER_TEMP/bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x "$RUNNER_TEMP/bazel"
          sudo mv "$RUNNER_TEMP/bazel" /usr/local/bin/bazel
          bazel version

      # Bazel fetches repository archives through BuildBuddy's Remote Asset
      # API, avoiding a multi-gigabyte GitHub Actions cache restore. The public
      # endpoint works for fork PRs; the key enables the repository's account.
      - name: Configure Bazel
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          echo "build --config=buildbuddy" > user.bazelrc
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            echo "build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> user.bazelrc
            echo "Authenticated BuildBuddy cache enabled"
          else
            echo "Anonymous BuildBuddy cache enabled"
          fi

      - name: Build everything
        run: bazel build //...

      # Covers the Rust unit tests, the Flutter analyze/format gates, the
      # example widget test, and //:rustfmt.
      - name: Test everything
        run: bazel test //...

      # Separate from the test run because rust_clippy is a build rule, not a
      # test. .bazelrc sets clippy_flag=-Dwarnings so this fails on any lint,
      # matching `cargo clippy -- -D warnings`.
      - name: Clippy
        run: bazel build //:clippy

      # xtask's deployment path invokes wasm-pack directly; keep that release
      # packaging and wasm-opt configuration covered in addition to Bazel's
      # wasm-bindgen target.
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WASM release package
        run: wasm-pack build --target web --release
        working-directory: razemify-wasm

      # The Flutter analyze/format gates and the example widget test are the
      # part Cargo cannot cover, so surface their logs when they fail.
      - name: Show test logs on failure
        if: failure()
        run: |
          find bazel-testlogs -name test.log -print -exec cat {} + || true
