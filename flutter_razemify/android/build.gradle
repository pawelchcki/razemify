group = "com.example.flutter_razemify"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Detect optimized build (release or profile) once for reuse across script
// Profile mode should use optimized Rust code for accurate performance testing
ext.isReleaseBuild = gradle.startParameter.taskNames.any {
    it.contains("Release") || it.contains("Profile")
}

// rules_flutter stages Bazel-built libraries into jniLibs. Conventional
// Flutter/Gradle builds still need to compile them from the Rust workspace.
ext.rustLibrariesProvidedByBazel = System.getenv("RULES_FLUTTER_MAVEN_MIRROR") != null
ext.rustProjectDir = file("${projectDir}/../rust")

android {
    namespace = "com.example.flutter_razemify"

    buildToolsVersion = "36.0.0"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21

        // Control which ABIs to build
        ndk {
            // Debug: only arm64 (fast iteration)
            // Release: all ABIs (full compatibility)
            if (isReleaseBuild) {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            } else {
                abiFilters 'arm64-v8a'
            }
        }
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

def hostOs = System.getProperty("os.name").toLowerCase()
def hostCpu = System.getProperty("os.arch").toLowerCase()
def ndkHost = "linux-x86_64"
if (hostOs.contains("mac")) {
    ndkHost = (hostCpu == "aarch64" || hostCpu == "arm64") ? "darwin-aarch64" : "darwin-x86_64"
} else if (hostOs.contains("linux") && (hostCpu == "aarch64" || hostCpu == "arm64")) {
    ndkHost = "linux-aarch64"
} else if (hostOs.contains("windows")) {
    ndkHost = "windows-x86_64"
}

def rustTargets = [
    [task: "buildRustArm64", triple: "aarch64-linux-android", abi: "arm64-v8a", releaseOnly: false],
    [task: "buildRustArmv7", triple: "armv7-linux-androideabi", abi: "armeabi-v7a", releaseOnly: true],
    [task: "buildRustX86", triple: "i686-linux-android", abi: "x86", releaseOnly: true],
    [task: "buildRustX86_64", triple: "x86_64-linux-android", abi: "x86_64", releaseOnly: true],
]

def rustBuildTasks = rustTargets.collect { target ->
    tasks.register(target.task, Exec) {
        def profile = project.ext.isReleaseBuild ? "release" : "debug"
        def ndkDir = android.ndkDirectory
        def toolchainBin = file("${ndkDir}/toolchains/llvm/prebuilt/${ndkHost}/bin")
        def linker = file("${toolchainBin}/${target.triple}${android.defaultConfig.minSdk}-clang")
        def cargoHome = System.getenv("CARGO_HOME") ?: "${System.getProperty("user.home")}/.cargo"

        // Declare inputs and outputs so Gradle can skip unchanged Rust builds.
        inputs.dir("${projectDir}/../rust")
        inputs.dir("${projectDir}/../../razemify-core/src")
        inputs.file("${projectDir}/../../razemify-core/Cargo.toml")
        inputs.file("${projectDir}/../../Cargo.toml")
        inputs.file("${projectDir}/../../Cargo.lock")
        inputs.files(fileTree("${projectDir}/../..") {
            include ".cargo/config", ".cargo/config.toml", "rust-toolchain", "rust-toolchain.toml"
        })
        inputs.files(fileTree(cargoHome) {
            include "config", "config.toml"
        })
        inputs.file(linker).optional()
        inputs.file(file("${toolchainBin}/llvm-ar")).optional()
        inputs.property("cargoVersion", providers.exec {
            commandLine "cargo", "--version"
        }.standardOutput.asText)
        inputs.property("rustcVersion", providers.exec {
            commandLine "rustc", "--version"
        }.standardOutput.asText)
        inputs.property("rustFlags", providers.environmentVariable("RUSTFLAGS").orElse(""))
        inputs.property("encodedRustFlags", providers.environmentVariable("CARGO_ENCODED_RUSTFLAGS").orElse(""))
        inputs.property("rustupToolchain", providers.environmentVariable("RUSTUP_TOOLCHAIN").orElse(""))
        inputs.property("profile", profile)
        outputs.file("${projectDir}/src/main/jniLibs/${target.abi}/libflutter_razemify.so")

        onlyIf {
            !project.ext.rustLibrariesProvidedByBazel &&
                (!target.releaseOnly || project.ext.isReleaseBuild)
        }

        doFirst {
            if (!linker.exists()) {
                throw new GradleException("Android NDK linker not found: ${linker}")
            }

            def envPrefix = target.triple.toUpperCase().replace('-', '_')
            workingDir project.ext.rustProjectDir
            environment "CARGO_TARGET_${envPrefix}_LINKER", linker.absolutePath
            environment "CC_${envPrefix}", linker.absolutePath
            environment "AR_${envPrefix}", file("${toolchainBin}/llvm-ar").absolutePath
            commandLine "cargo", "build", "--target", target.triple
            if (project.ext.isReleaseBuild) {
                args "--release"
            }
        }

        doLast {
            def rustLib = file("${projectDir}/../../target/${target.triple}/${profile}/libflutter_razemify.so")
            if (!rustLib.exists() || rustLib.length() < 1024) {
                throw new GradleException("Rust build did not produce a valid library: ${rustLib}")
            }
            copy {
                from rustLib
                into file("${projectDir}/src/main/jniLibs/${target.abi}")
            }
        }
    }
}

tasks.register("buildRust") {
    dependsOn rustBuildTasks
}

preBuild.dependsOn tasks.named("buildRust")
