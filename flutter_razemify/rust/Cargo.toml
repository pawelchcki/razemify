[package]
name = "flutter_razemify"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
razemify-core = { path = "../../razemify-core", default-features = false, features = ["flutter_ffi"] }

# Release profile lives in the workspace root Cargo.toml; cargo ignores
# profiles declared by non-root members.
